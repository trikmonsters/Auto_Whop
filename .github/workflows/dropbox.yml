name: Cloud Video Processor

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Dropbox or Google Drive file/folder URL"
        required: true
        type: string

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install --break-system-packages gdown
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          DROPBOX_TOKEN: ${{ secrets.DROPBOX_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone

          cat > ~/.config/rclone/rclone.conf <<EOF
          [dropbox]
          type = dropbox
          token = ${DROPBOX_TOKEN}
          EOF

      - name: Detect source
        env:
          URL: ${{ inputs.url }}
        run: |
          if [[ "$URL" == *"dropbox.com"* ]]; then
            echo "SOURCE=dropbox" >> "$GITHUB_ENV"
          elif [[ "$URL" == *"drive.google.com"* ]] || [[ "$URL" == *"docs.google.com"* ]]; then
            echo "SOURCE=google_drive" >> "$GITHUB_ENV"
          else
            echo "Unsupported URL"
            exit 1
          fi

      - name: Download Dropbox
        if: env.SOURCE == 'dropbox'
        env:
          URL: ${{ inputs.url }}
        run: |
          mkdir -p input

          python3 - "$URL" <<'PY'
          import sys
          from urllib.parse import urlparse, parse_qs, unquote

          url = sys.argv[1]
          parsed = urlparse(url)
          path = unquote(parsed.path)

          if "/scl/fo/" in path:
              print("Dropbox shared folder detected.")
              print("Shared Dropbox folders require a Dropbox remote path.")
              sys.exit(1)

          if "/s/" in path:
              print("Dropbox shared file detected.")
              print("Direct shared links are not supported by rclone path mode.")
              sys.exit(1)

          print(path)
          PY

          DROPBOX_PATH=$(python3 - "$URL" <<'PY'
          import sys
          from urllib.parse import urlparse, unquote

          url = sys.argv[1]
          parsed = urlparse(url)
          path = unquote(parsed.path)

          if "/home/" in path:
              path = path.split("/home/", 1)[1]
              path = "/" + path

          print(path)
          PY
          )

          rclone copy \
            "dropbox:${DROPBOX_PATH}" \
            ./input \
            --include "*.mp4" \
            --include "*.MP4" \
            --include "*.mov" \
            --include "*.MOV" \
            --include "*.mkv" \
            --include "*.MKV" \
            --include "*.webm" \
            --include "*.WEBM" \
            --include "*.avi" \
            --include "*.AVI" \
            --include "*.m4v" \
            --include "*.M4V" \
            --include "*.wmv" \
            --include "*.WMV" \
            --transfers 4 \
            --checkers 8 \
            --retries 10 \
            --low-level-retries 20 \
            --retries-sleep 5s \
            --stats 10s \
            --progress

      - name: Download Google Drive
        if: env.SOURCE == 'google_drive'
        env:
          URL: ${{ inputs.url }}
        run: |
          mkdir -p input

          if [[ "$URL" == *"/folders/"* ]]; then
            gdown "$URL" \
              --folder \
              --remaining-ok \
              -O input
          else
            gdown "$URL" \
              -O input
          fi

      - name: Filter videos
        run: |
          mkdir -p videos

          find input -type f \
            \( -iname "*.mp4" \
            -o -iname "*.mov" \
            -o -iname "*.mkv" \
            -o -iname "*.webm" \
            -o -iname "*.avi" \
            -o -iname "*.m4v" \
            -o -iname "*.wmv" \) \
            -print0 |
          while IFS= read -r -d '' file; do
            relative="${file#input/}"
            mkdir -p "videos/$(dirname "$relative")"
            cp "$file" "videos/$relative"
          done

          find videos -type f -print

      - name: Process videos
        run: |
          mkdir -p output

          find videos -type f -print0 |
          while IFS= read -r -d '' input; do
            relative="${input#videos/}"
            directory="$(dirname "$relative")"
            filename="$(basename "$relative")"
            name="${filename%.*}"

            mkdir -p "output/$directory"

            ffmpeg \
              -hide_banner \
              -loglevel warning \
              -y \
              -i "$input" \
              -map 0:v:0 \
              -map 0:a? \
              -c:v libx264 \
              -preset faster \
              -crf 28 \
              -pix_fmt yuv420p \
              -c:a aac \
              -b:a 128k \
              -movflags +faststart \
              "output/$directory/${name}_compressed.mp4"
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="videos-$(date +'%Y%m%d-%H%M%S')"

          gh release create "$TAG" \
            --title "Processed Videos $TAG" \
            --notes "Videos downloaded and compressed automatically."

          echo "$TAG" > release_tag

      - name: Upload videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(cat release_tag)

          find output -type f -name "*.mp4" -print0 |
          while IFS= read -r -d '' file; do
            size=$(stat -c%s "$file")

            if [ "$size" -gt 2147483648 ]; then
              echo "Skipping file larger than 2 GB: $file"
              continue
            fi

            gh release upload "$TAG" "$file"
          done

      - name: Summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(cat release_tag)
          URL=$(gh release view "$TAG" --json url --jq '.url')

          echo "Release: $URL"
          echo ""
          echo "Processed files:"
          find output -type f -name "*.mp4" -print
